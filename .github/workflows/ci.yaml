name: CI
on:
  pull_request:
    branches: [c4t, dev, suite, suite-c4t, deployment]
env:
  CI: true
jobs:
  Build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: yarn
          node-version: ${{ matrix.node-version }}
      - run: yarn install
      - run: yarn format-check
      - name: jest-run
        run: yarn test